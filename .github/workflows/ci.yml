name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    env:
      # Inlined at build time by Vite; the build guard refuses to run without
      # it (a missing value compiles every image URL to res.cloudinary.com/
      # undefined/... and ships a blank page). Public value, not a secret.
      VITE_CLOUDINARY_CLOUD_NAME: ece5jmhy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
